x-worker-environment: &worker-environment
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
  REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}

x-system-worker: &system-worker
  image: oda-system-worker:local
  build:
    context: .
    dockerfile: apps/system-worker/Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./scripts:/app/scripts
    - ./backups:/app/backups
  stop_grace_period: 5m
  depends_on:
    postgres:
      condition: service_started
    redis:
      condition: service_healthy

x-scraper-worker: &scraper-worker
  image: oda-scraper:local
  build:
    context: .
    dockerfile: apps/scraper/Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment: *worker-environment
  volumes:
    - ./apps/scraper/data:/app/apps/scraper/data
    - ./apps/api/static:/app/apps/api/static
  shm_size: 1gb
  stop_grace_period: 5m

x-etl-worker: &etl-worker
  image: oda-etl:local
  build:
    context: .
    dockerfile: apps/etl/Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - .env
  volumes:
    - ./apps/scraper/data:/data
  environment:
    <<: *worker-environment
    SCRAPER_DATA_DIR: /data
  stop_grace_period: 5m

services:
  postgres:
    profiles: ["core"]
    image: pgvector/pgvector:pg18-trixie
    container_name: oda_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    profiles: ["core"]
    image: redis:7-alpine
    container_name: oda_redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    # Reserva adicional para buffers, fragmentacao e reescrita do AOF.
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:6379:6379"

  api:
    profiles: ["core"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: oda_api
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./apps/api/static:/app/static
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_started

  langchain:
    profiles: ["core"]
    image: oda-langchain:local
    build:
      context: .
      dockerfile: apps/langchain-ts/Dockerfile
    container_name: oda_langchain_ts
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - OPEN_AI_KEY=${OPEN_AI_KEY}
      - LANGCHAIN_PORT=8002
    depends_on:
      - postgres

  langchain-worker:
    profiles: ["core"]
    image: oda-langchain:local
    build:
      context: .
      dockerfile: apps/langchain-ts/Dockerfile
    container_name: oda_langchain_worker
    restart: unless-stopped
    command: ["node", "dist/queue/aiWorker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPEN_AI_KEY: ${OPEN_AI_KEY}
    stop_grace_period: 5m
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy

  etl:
    <<: *etl-worker
    profiles: ["scraper"]
    container_name: oda_etl
    hostname: etl
    command: ["node", "dist/queue/etlCli.js", "worker", "--scope", "default"]

  etl-simcc:
    <<: *etl-worker
    profiles: ["simcc"]
    container_name: oda_etl_simcc
    hostname: etl-simcc
    command: ["node", "dist/queue/etlCli.js", "worker", "--scope", "simcc"]

  system-worker:
    <<: *system-worker
    profiles: ["core"]
    container_name: oda_system_worker
    hostname: system-worker
    command: ["node", "dist/queue/systemWorker.js"]

  scraper-dgp:
    <<: *scraper-worker
    profiles: ["scraper"]
    container_name: oda_scraper_dgp
    hostname: scraper-dgp
    command: ["node", "dist/queue/dgp/dgpCli.js", "worker"]

  scraper-simcc:
    <<: *scraper-worker
    profiles: ["simcc"]
    container_name: oda_scraper_simcc
    hostname: scraper-simcc
    command: ["node", "dist/queue/dgp/dgpCli.js", "worker", "--scope", "simcc"]

  scraper-simcc-enqueue:
    <<: *scraper-worker
    profiles: ["jobs"]
    restart: "no"
    command: ["node", "dist/queue/dgp/dgpCli.js", "enqueue", "--scope", "simcc"]

  scraper-lattes:
    <<: *scraper-worker
    profiles: ["scraper"]
    container_name: oda_scraper_lattes
    hostname: scraper-lattes
    command: ["node", "dist/queue/lattes/lattesCli.js", "worker"]

  scraper-discovery:
    <<: *scraper-worker
    profiles: ["scraper"]
    container_name: oda_scraper_discovery
    hostname: scraper-discovery
    command: ["node", "dist/queue/discovery/discoveryCli.js", "worker"]

volumes:
  redis_data:
  postgres_data:
